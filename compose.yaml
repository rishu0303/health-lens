services:
  app:
    build: .
    ports:
      - "127.0.0.1:5003:5003"
    environment:
      NODE_ENV: production
      PORT: 5003
      MONGO_URI: mongodb://mongo:27017/health-lens
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in the root .env file}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - uploads:/app/backend/uploads
      - rag-cache:/app/backend/.rag-cache
    restart: unless-stopped
  mongo:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mongo-data:
  uploads:
  rag-cache:
